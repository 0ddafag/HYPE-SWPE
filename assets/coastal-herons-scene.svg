<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Coastal Herons Scene</title>
  <desc id="desc">A bright lake scene with blue sky, cream clouds, pink herons, and green land.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fa7ea"/>
      <stop offset="43%" stop-color="#8ed4f6"/>
      <stop offset="70%" stop-color="#dff1fb"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#167cc6"/>
      <stop offset="100%" stop-color="#2f98d4"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cddf92"/>
      <stop offset="100%" stop-color="#8eb86c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <style>
      .ink { stroke: #20344d; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .bird { fill: #ec6cb6; }
      .bird-soft { fill: #f4a8d3; }
      .bird-shadow { fill: #c94c96; }
      .skim { stroke: rgba(26, 76, 118, 0.42); stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="250" width="1600" height="330" fill="url(#water)"/>

